<div class="dashboard">

    <div class="dashboard-header">

        <h1 id="companyTitle">AARVEE ASSOCIATES</h1>

        <p id="welcomeUser"></p>

    </div>

    <!-- Dashboard Statistics -->

    <div class="dashboard-cards">

        <!-- Your 6 statistic cards -->

    </div>

    <!-- ADD THE CHARTS HERE -->

    <div class="dashboard-row">

        <div class="card">

            <h3>Monthly Collection</h3>

            <canvas id="collectionChart"></canvas>

        </div>

        <div class="card">

            <h3>Loan Status</h3>

            <canvas id="loanStatusChart"></canvas>

        </div>

    </div>

    <div class="dashboard-row">

        <div class="card">

            <h3>Payment Mode</h3>

            <canvas id="paymentModeChart"></canvas>

        </div>

        <div class="card">

            <h3>Loan Disbursement</h3>

            <canvas id="loanChart"></canvas>

        </div>

    </div>

    <!-- EXISTING RECENT TABLES -->

    <div class="dashboard-row">

        <div class="card">

            <h3>Recent Loans</h3>

            <table class="table">

                <thead>

                    <tr>

                        <th>Loan ID</th>

                        <th>Customer</th>

                        <th>Amount</th>

                    </tr>

                </thead>

                <tbody id="recentLoans"></tbody>

            </table>

        </div>

        <div class="card">

            <h3>Recent Collections</h3>

            <table class="table">

                <thead>

                    <tr>

                        <th>Receipt</th>

                        <th>Customer</th>

                        <th>Amount</th>

                    </tr>

                </thead>

                <tbody id="recentCollections"></tbody>

            </table>

        </div>

    </div>

</div>
