<div class="page-header">
    <h2>Collection Entry</h2>
</div>

<div class="card">

    <div class="collection-form">

        <div class="form-group">
            <label>Group</label>
            <select id="collectionGroup">
                <option value="">Select Group</option>
            </select>
        </div>

        <div class="form-group">
            <label>Collection Day</label>
            <input type="text"
                   id="collectionDay"
                   readonly>
        </div>

        <div class="form-group">
            <label>Collection Date</label>
            <input type="date"
                   id="collectionDate">
        </div>

        <div class="form-group">
            <label>Entry Date</label>
            <input type="date"
                   id="entryDate">
        </div>

    </div>

    <div class="collection-actions">

        <button class="btn btn-primary"
                onclick="loadCollection()">

            <i class="fas fa-search"></i>
            Load Collection

        </button>

        <button class="btn btn-success"
                onclick="saveCollection()">

            <i class="fas fa-save"></i>
            Save Collection

        </button>

    </div>

</div>


<div class="card">

    <div class="table-header">

        <h3>Today's Collection</h3>

        <input
            type="text"
            id="searchCollection"
            placeholder="Search Loan No / Customer">

    </div>

    <div class="table-responsive">

        <table class="table">

            <thead>

                <tr>

                    <th width="50">#</th>

                    <th width="120">Loan No</th>

                    <th>Customer Name</th>

                    <th width="120">Mobile</th>

                    <th width="100">EMI</th>

                    <th width="120">Paid</th>

                    <th width="120">Penalty</th>

                    <th width="120">Balance</th>

                    <th width="120">Status</th>

                </tr>

            </thead>

            <tbody id="collectionTable">

                <tr>

                    <td colspan="9"
                        class="empty-row">

                        Select a Group and click
                        <strong>Load Collection</strong>

                    </td>

                </tr>

            </tbody>

        </table>

    </div>

</div>


<div class="card">

    <h3>Collection History</h3>

    <div class="table-responsive">

        <table class="table">

            <thead>

                <tr>

                    <th>Date</th>

                    <th>Loan No</th>

                    <th>Customer</th>

                    <th>Paid</th>

                    <th>Penalty</th>

                    <th>Balance</th>

                </tr>

            </thead>

            <tbody id="collectionHistory">

                <tr>

                    <td colspan="6"
                        class="empty-row">

                        No Collection Found

                    </td>

                </tr>

            </tbody>

        </table>

    </div>

</div>
