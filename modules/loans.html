<div class="card">

    <div class="page-header">

        <h2>Loan Management</h2>

        <button class="btn btn-primary" id="addLoanBtn">
            + New Loan
        </button>

    </div>

    <br>

    <input
        type="text"
        id="searchLoan"
        placeholder="Search Customer / Loan ID">

    <br><br>

    <div class="table-responsive">

<table class="data-table">

        <thead>

            <tr>

                <th>Loan ID</th>
                <th>Customer</th>
                <th>Loan Amount</th>
                <th>Interest %</th>
                <th>EMI</th>
                <th>Balance</th>
                <th>Status</th>
                <th>Action</th>

            </tr>

        </thead>

        <tbody id="loanTable">

            <tr>

                <td colspan="8" style="text-align:center">

                    No Loans Found

                </td>

            </tr>

        </tbody>

    </table>

</div>

<!-- Loan Modal -->

<div class="modal hidden" id="loanModal">

<div class="modal-box" style="width:950px;">

<h2 id="loanTitle">

Create Loan

</h2>

<br>

<div class="form-grid">

<div>

<label>Loan ID</label>

<input id="loanID" readonly>

</div>

<div>

<label>Customer</label>

<select id="loanCustomer">

<option value="">Select Customer</option>

</select>

</div>

<div>

<label>Guarantor</label>

<select id="loanGuarantor">

<option value="">Select Guarantor</option>

</select>

</div>

<div>

<label>Loan Amount</label>

<input
type="number"
id="loanAmount">

</div>

<div>

<label>Interest %</label>

<input
type="number"
id="loanInterest"
value="18">

</div>

<div>

<label>Installments</label>

<input
type="number"
id="loanMonths"
value="12">

</div>

<div>

<label>Loan Date</label>

<input
type="date"
id="loanDate">

</div>

<div>

<label>Status</label>

<select id="loanStatus">

<option>Active</option>

<option>Closed</option>

</select>

</div>

</div>

<hr>

<h3>Loan Summary</h3>

<p>Total Interest :
<span id="interestAmount">0</span></p>

<p>Total Repayment :
<span id="totalAmount">0</span></p>

<p>Monthly EMI :
<span id="emiAmount">0</span></p>

<br>

<button
class="btn btn-success"
id="saveLoan">

Save Loan

</button>

<button
class="btn btn-danger"
id="closeLoan">

Cancel

</button>

</div>

</div>
